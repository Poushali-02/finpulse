[project]
name = "finpulse"
version = "0.1.0"
description = "Unofficial concept: an MCP server and month-end agent check over made-up AR/AP data."
authors = [
    { name = "Poushali Bhattacharyya", email = "poushalibhattacharyya02@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
finpulse = "finpulse:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
