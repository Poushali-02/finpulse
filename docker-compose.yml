services:
  db:
    image: postgres:16
    container_name: finpulse-db
    environment:
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: finpulse
      POSTGRES_DB: finpulse
    ports:
      - "5432:5432"
    volumes:
      - finpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finpulse_pgdata:
